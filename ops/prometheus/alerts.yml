# Prometheus alerting rules for TradingApp.
#
# Pairs with the Grafana dashboard in ops/grafana/tradingapp-dashboard.json:
# every expression below reuses the same metrics and label conventions the
# dashboard panels rely on, so an alert and its panel always agree.
#
# Wiring (prometheus.yml):
#
#   rule_files:
#     - /etc/prometheus/alerts.yml
#
#   scrape_configs:
#     - job_name: tradingapp-backend
#       static_configs: [{ targets: ['backend:4000'] }]
#       metrics_path: /metrics
#     - job_name: tradingapp-broker_service
#       static_configs: [{ targets: ['broker_service:8000'] }]
#       metrics_path: /metrics
#
# Metric provenance:
#   backend (prom-client)                 — http_request_duration_seconds_*,
#                                            nodejs_eventloop_lag_p99_seconds,
#                                            process_resident_memory_bytes,
#                                            all carry the label service="backend".
#   broker_service (prometheus_fastapi_instrumentator)
#                                         — http_request_duration_seconds_* with
#                                            labels method/handler/status.
#
# Note on the 5xx selector: status=~"5.." matches BOTH the backend's numeric
# codes ("500") and the instrumentator's grouped codes ("5xx") because "." in
# a PromQL regex matches any character.
#
# Thresholds and `for` windows below are deliberately conservative starting
# points — tune them to your traffic before treating them as a hard SLO.

groups:
  # -----------------------------------------------------------------------
  # Availability — is the scrape target up at all?
  # -----------------------------------------------------------------------
  - name: tradingapp-availability
    rules:
      - alert: TradingAppTargetDown
        expr: up{job=~"tradingapp-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: >-
            Prometheus has not been able to scrape {{ $labels.job }}
            ({{ $labels.instance }}) for more than 2 minutes. /metrics is
            unreachable — the service is likely crashed, unhealthy or
            network-partitioned.

  # -----------------------------------------------------------------------
  # Backend (Express + prom-client)
  # -----------------------------------------------------------------------
  - name: tradingapp-backend
    rules:
      - alert: BackendHighErrorRate
        # >5% of backend requests returning 5xx over the last 5m.
        expr: >-
          100 * sum(rate(http_request_duration_seconds_count{service="backend",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_request_duration_seconds_count{service="backend"}[5m])), 0.001)
          > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend 5xx error rate above 5%"
          description: >-
            {{ printf "%.1f" $value }}% of backend requests have returned 5xx
            over the last 5 minutes (sustained 10m). Check the backend
            structured logs (grep the X-Request-Id) and the IB-service
            dependency.

      - alert: BackendHighLatencyP95
        # p95 request latency over 1s for 10m.
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{service="backend"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency above 1s"
          description: >-
            Backend p95 request latency is {{ printf "%.2f" $value }}s
            (threshold 1s) over a sustained 10m window.

      - alert: BackendEventLoopLagHigh
        # Node event-loop p99 lag over 200ms signals blocking work on the
        # main thread (sync IB-bound calls, large JSON, etc).
        expr: nodejs_eventloop_lag_p99_seconds{service="backend"} > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend event-loop lag (p99) above 200ms"
          description: >-
            nodejs_eventloop_lag_p99_seconds is {{ printf "%.3f" $value }}s.
            The event loop is being blocked — latency and throughput will
            suffer.

  # -----------------------------------------------------------------------
  # IB service (FastAPI + prometheus_fastapi_instrumentator)
  # -----------------------------------------------------------------------
  - name: tradingapp-broker_service
    rules:
      - alert: IBServiceHighErrorRate
        # >5% 5xx over 5m, excluding the infra endpoints the dashboard also
        # filters out.
        expr: >-
          100 * sum(rate(http_request_duration_seconds_count{handler!~"/metrics|/health",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_request_duration_seconds_count{handler!~"/metrics|/health"}[5m])), 0.001)
          > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "IB service 5xx error rate above 5%"
          description: >-
            {{ printf "%.1f" $value }}% of IB-service requests have returned
            5xx over the last 5 minutes. Often the IB Gateway connection has
            dropped — check `./tradingapp.sh status` and the broker_service logs.

      - alert: IBServiceHighLatencyP95
        # IB calls are inherently slower than backend-local work, so the
        # threshold is higher (2s) than the backend's.
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{handler!~"/metrics|/health"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "IB service p95 latency above 2s"
          description: >-
            IB-service p95 request latency is {{ printf "%.2f" $value }}s
            (threshold 2s) over a sustained 10m window. The single synchronous
            IB client serialises requests — sustained high latency may mean it
            is saturated (consider IB_CLIENT_POOL_SIZE >= 2).

      - alert: IBServiceNoTraffic
        # The IB service is up (scraped) but has served zero non-infra
        # requests for 30m. Either the backend stopped calling it or routing
        # is broken. Info-level: legitimately quiet overnight, so non-paging.
        expr: >-
          sum(rate(http_request_duration_seconds_count{handler!~"/metrics|/health"}[15m])) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "IB service has served no application traffic for 30m"
          description: >-
            No non-infra requests have hit the IB service in 30 minutes.
            Expected if the platform is idle; investigate if it should be
            actively serving charts or streaming.

  # -----------------------------------------------------------------------
  # Fleet — per-connection health (Component C — C-5)
  # -----------------------------------------------------------------------
  # Every rule here is keyed on `connection` (platform:account), not on
  # platform. "MT5 is up" is not a useful statement when three MT5 accounts
  # are trading and one is wedged at a login dialog — which is the common
  # failure, since the terminal is a GUI app that can sit at a login prompt
  # indefinitely while the host answers pings perfectly well.
  - name: tradingapp-fleet
    rules:
      - alert: ConnectionBreakerOpen
        # The runner has given up on a connection after repeated failures and
        # is skipping its runs. Those strategies are not trading.
        expr: tradingapp_connection_breaker_open == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Connection {{ $labels.connection }} is being skipped"
          description: >-
            The strategy runner has opened its circuit breaker for
            {{ $labels.connection }} after repeated failures, so every run on
            that account has stopped evaluating. Other connections are
            unaffected by design — check the sidecar host and the terminal's
            login state.

      - alert: UnprotectedPosition
        # E-2 refuses to *create* this state, so finding one means it arrived
        # another way: a stop the venue silently dropped, or one removed by
        # hand. Pages immediately — this is real money with no floor under it.
        expr: tradingapp_unprotected_positions > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Open position with no stop on {{ $labels.connection }}"
          description: >-
            {{ $value }} open position(s) on {{ $labels.connection }} have no
            protective stop at the venue, though their strategy declares one.
            An unprotected position is never an acceptable resting state.

      - alert: PositionDivergence
        # Benign in bursts — a broker-side stop or a manual trade produces a
        # fill with no order of ours behind it. Sustained divergence means
        # fills are being missed, which silently corrupts realised P&L and
        # every loss cap measured from it.
        expr: tradingapp_connection_position_divergence > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Venue and recorded positions disagree on {{ $labels.connection }}"
          description: >-
            Positions on {{ $labels.connection }} have disagreed with the
            fills feed for 30 minutes. Brief divergence is expected after a
            broker-side exit; sustained divergence means fills are being
            missed. Check /api/account/reconciliation/all.

      - alert: KillSwitchStopGap
        # Price jumped a stop. Notify-only by default, so this alert may be
        # the *only* response — treat it as one requiring a human.
        expr: increase(tradingapp_kill_switch_triggers_total{kind="stop_gap"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Position closed well past its stop on {{ $labels.connection }}"
          description: >-
            A position on {{ $labels.connection }} closed materially beyond
            the stop that was in force — the market likely gapped through it.
            With KILL_SWITCH_ACTION=notify nothing was halted automatically.

      - alert: OrdersBlockedByCap
        # Not a failure on its own: a cap doing its job. Sustained blocking
        # means a strategy is trying to trade and cannot, which the operator
        # should know about rather than discover from missing trades.
        expr: increase(tradingapp_orders_blocked_by_cap_total[1h]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Risk caps are repeatedly blocking orders on {{ $labels.connection }}"
          description: >-
            {{ $value }} orders were refused by the {{ $labels.level }} cap on
            {{ $labels.connection }} in the last hour. Either the strategy is
            over-trading or the cap is set tighter than intended.

      - alert: ConnectionHasNoActiveRuns
        # A connection configured but evaluating nothing. Info-level: perfectly
        # normal after a deliberate stop, worth noticing if it was unintended.
        expr: tradingapp_connection_active_runs == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "No strategies running on {{ $labels.connection }}"
          description: >-
            {{ $labels.connection }} has had no active runs for an hour.
            Expected if you stopped them; investigate if a group was
            abandoned or its canary failed.
