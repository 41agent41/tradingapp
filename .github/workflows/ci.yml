name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Backend (Node + TypeScript)
  # --------------------------------------------------------------------
  backend:
    name: backend (lint / type-check / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real database for the tests whose SQL must meet Postgres
    # (tests/*.db.test.ts); everything else fakes it.
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: tradingapp
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tradingapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradingapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests (jest + supertest)
        run: npm test

      - name: Database tests (TimescaleDB)
        env:
          DB_TESTS: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: tradingapp
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tradingapp
          PGPASSWORD: ci-password
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -h localhost -U tradingapp -d tradingapp \
            -f src/database/timescaledb-schema.sql > /dev/null
          npx jest tests/marketDataStorage.db.test.ts

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------
  # Frontend (Next.js + React)
  # --------------------------------------------------------------------
  frontend:
    name: frontend (lint / type-check / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------
  # IB service (Python / FastAPI)
  # --------------------------------------------------------------------
  broker_service:
    name: broker_service (ruff / black / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker_service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            broker_service/requirements.txt
            broker_service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest
        run: pytest -q

  # --------------------------------------------------------------------
  # MT5 sidecar (Python / FastAPI, tested against a fake terminal)
  # --------------------------------------------------------------------
  mt5_sidecar:
    name: mt5_sidecar (ruff / black / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mt5_sidecar
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            mt5_sidecar/requirements.txt
            mt5_sidecar/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest
        run: pytest -q

  # --------------------------------------------------------------------
  # End to end: backend + broker service + the real sidecar app over two
  # simulated MT5 terminals, trading on paper (PAPER_DEPLOYMENT_RUNBOOK.md
  # steps 11-22, plus a restart of the backend and broker service).
  # --------------------------------------------------------------------
  e2e:
    name: e2e (paper run against simulated MT5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: tradingapp
          POSTGRES_PASSWORD: e2e-password
          POSTGRES_DB: tradingapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradingapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: tradingapp
      POSTGRES_PASSWORD: e2e-password
      POSTGRES_DB: tradingapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            broker_service/requirements.txt
            broker_service/requirements-dev.txt
            mt5_sidecar/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r broker_service/requirements.txt -r broker_service/requirements-dev.txt \
            -r mt5_sidecar/requirements.txt
          (cd backend && npm install --no-audit --no-fund && npm run build)

      - name: Paper run
        run: e2e/run.sh
