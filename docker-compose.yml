services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - PORT=${BACKEND_PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # The frontend container forwards the browser's API calls; believe the
      # client address it passes on, and no one else's.
      - TRUST_PROXY=${TRUST_PROXY:-172.20.0.3}
      - BROKER_SERVICE_URL=http://172.20.0.10:8000
      - POSTGRES_HOST=${POSTGRES_HOST:-localhost}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-tradingapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-tradingapp}
      - POSTGRES_SSL=${POSTGRES_SSL:-false}
      - REDIS_HOST=172.20.0.30
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Browser login: APP_PASSWORD, with sessions signed by SESSION_SECRET.
      # API_TOKEN is for scripts (Authorization: Bearer). With NODE_ENV=
      # production the backend refuses to start without them, or with
      # template values. No defaults here on purpose.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      # Shared secret the backend sends to the broker service.
      - BROKER_SERVICE_TOKEN=${BROKER_SERVICE_TOKEN:-}
      # Schedulers, cache, streaming, alerts and the heartbeat are set on the
      # Settings page. A value in .env (passed in by env_file) still wins and
      # shows there as locked, so these are deliberately not defaulted here.
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    depends_on:
      - broker_service
      - redis
    networks:
      tradingapp-network:
        ipv4_address: 172.20.0.5
    restart: unless-stopped
      
  frontend:
    build: 
      context: ./frontend
      args:
        - NODE_ENV=${NODE_ENV:-production}
    # No env_file: the frontend needs none of .env's secrets. The page calls
    # the API on its own address and the frontend server forwards it here.
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - BACKEND_INTERNAL_URL=http://172.20.0.5:${BACKEND_PORT:-4000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      - backend
    networks:
      tradingapp-network:
        ipv4_address: 172.20.0.3
    restart: unless-stopped
      
  broker_service:
    build: ./broker_service
    env_file: .env
    environment:
      - IB_HOST=${IB_HOST:-}
      - IB_PORT=${IB_PORT:-4002}
      - IB_CLIENT_ID=${IB_CLIENT_ID:-1}
      - IB_TIMEOUT=${IB_TIMEOUT:-30}
      - IB_CORS_ORIGINS=${IB_CORS_ORIGINS:-http://localhost:3000}
      # Timezone configuration for consistent timestamp handling
      - TZ=UTC
      - IB_TIMEZONE=${IB_TIMEZONE:-UTC}
      - EXPECTED_TIMESTAMP_FORMAT=${EXPECTED_TIMESTAMP_FORMAT:-unix_seconds}
      - DATA_TIMEZONE=${DATA_TIMEZONE:-UTC}
      - IB_FORMAT_DATE=${IB_FORMAT_DATE:-2}
      - BROKER_SERVICE_TOKEN=${BROKER_SERVICE_TOKEN:-}
    # The broker service can place orders, and only the backend should call
    # it. It is published on the host's loopback only (for `tradingapp.sh
    # test`), never on the LAN, and every call needs BROKER_SERVICE_TOKEN.
    ports:
      - "127.0.0.1:${BROKER_SERVICE_PORT:-8000}:8000"
    networks:
      tradingapp-network:
        ipv4_address: 172.20.0.10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
      

      
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not published on the host: only containers on this network use it.
    # An empty REDIS_PASSWORD disables auth (development only).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    networks:
      tradingapp-network:
        ipv4_address: 172.20.0.30



networks:
  tradingapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1 