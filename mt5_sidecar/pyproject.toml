[project]
name = "tradingapp-mt5-sidecar"
version = "0.1.0"
description = "HTTP bridge between the TradingApp broker service and a MetaTrader 5 terminal"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["config", "server", "server_time", "terminal", "fake_mt5", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["ignore:The 'app' shortcut is now deprecated:DeprecationWarning"]
