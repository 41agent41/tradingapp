# The bundled database: TimescaleDB as a container on this host, the default
# for a new install. `./tradingapp.sh install` layers this file in (and keeps
# doing so while .tradingapp.with-db exists); with --external-db it is not
# used. Its data lives in the tradingapp_pgdata volume, which `clean` keeps
# unless --include-database is given.
#
# The backend creates and updates the schema itself when it starts
# (backend/src/services/migrations.ts), so this database needs nothing but the
# credentials below.

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradingapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tradingapp}
      # Force UTC so timestamps round-trip cleanly with the broker service.
      PGTZ: UTC
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tradingapp_pgdata:/var/lib/postgresql/data
    networks:
      tradingapp-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Point the backend at the local Postgres when this override is active.
  # POSTGRES_HOST is set explicitly so it overrides any value in .env.
  backend:
    environment:
      - POSTGRES_HOST=172.20.0.20
      - POSTGRES_PORT=5432
      - POSTGRES_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
      broker_service:
        condition: service_started
      redis:
        condition: service_started

volumes:
  tradingapp_pgdata:
    driver: local
